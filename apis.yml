aid: avi-networks
name: AVI Networks
description: AVI Networks builds a software-defined application delivery platform - the Avi Vantage Platform / Avi
  Load Balancer - providing multi-cloud load balancing, web application firewall (WAF), GSLB, container ingress,
  and analytics driven by a central Avi Controller with a fully programmable REST API. Founded in 2012 and headquartered
  in Santa Clara, California, AVI Networks was acquired by VMware in 2019 and the product is now offered by Broadcom
  as the VMware Avi Load Balancer. The controller exposes a comprehensive REST API with first-party Python, Go,
  and Java SDKs, a Terraform provider, and Ansible automation for intent-based, self-service application services
  across VMware, AWS, Azure, GCP, OpenStack, and bare-metal environments.
